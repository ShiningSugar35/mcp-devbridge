name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12

      - name: Setup venv
        run: uv venv

      - name: Install dependencies
        run: uv pip install -p .venv -e ".[dev,package]"

      - name: Lint (ruff)
        run: .venv\Scripts\python.exe -m ruff check src tests

      - name: Typecheck (pyright)
        run: .venv\Scripts\python.exe -m pyright --pythonpath .venv\Scripts\python.exe src tests

      - name: Unit tests (pytest)
        run: .venv\Scripts\python.exe -m pytest tests/ -q --disable-warnings

      - name: CodexPro engine build (TypeScript)
        working-directory: third_party/codexpro
        run: npm ci && npm run build

      - name: CodexPro async task smoke
        working-directory: third_party/codexpro
        run: node scripts/async-task-smoke.mjs

      - name: Verify build script syntax
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }