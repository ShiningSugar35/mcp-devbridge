[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-devbridge"
version = "0.1.0"
description = "MCP DevBridge - desktop bridge that connects ChatGPT / Gemini MCP clients to local dev workspaces via a fixed Cloudflare Named Tunnel endpoint"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MCP DevBridge" }]
dependencies = [
    "mcp==2.0.0",
    "uvicorn>=0.35.0",
    "starlette>=0.45.0",
    "pydantic>=2.10.0",
    "platformdirs>=4.3.0",
    "psutil>=6.1.0",
    "PySide6>=6.8.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]
package = [
    "pyinstaller>=6.11.0",
]

[project.scripts]
localdev-mcp-bridge = "local_dev_mcp_bridge.desktop_main:main"
localdev-mcp-standalone = "local_dev_mcp_bridge.standalone_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_dev_mcp_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "A"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportUnusedImports = true